name: PR checks
on:
  pull_request:
    branches:
      - bfs/working
      - development
      - main
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Add safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Import and run check
        run: GODOT=godot tools/check.sh
      - name: Run tests
        run: GODOT=godot tools/test.sh
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
      - name: Setup Godot cache
        uses: actions/cache@v4
        with:
          path: /root/.local/share/godot/export_templates
          key: godot-export-templates-4.7.2
      - name: Download export templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
      - name: Build Web export
        run: |
          mkdir -v -p build/web
          godot --headless --export-release "Web" build/web/index.html
      - name: Verify build output
        run: test -f build/web/index.html
