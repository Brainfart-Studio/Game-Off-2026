name: PR checks
on:
  pull_request:
    branches:
      - bfs/working
      - development
      - main
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Add safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Import and run check
        run: GODOT=godot tools/check.sh
      - name: Run tests
        run: GODOT=godot tools/test.sh
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
